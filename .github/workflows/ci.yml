name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # Mirrors the check gate documented in CONTRIBUTING.md. The toolchain comes
  # from rust-toolchain.toml (stable + rustfmt + clippy), which rustup installs
  # automatically on first cargo invocation.
  test:
    name: test
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --verbose --all-features
        timeout-minutes: 30

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt -- --check

  # Bash installer/registry tests. Needs bash, jq and git — all present on the
  # GitHub-hosted Ubuntu image.
  shell-tests:
    name: shell tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: ./tests/run.sh

  # Advisory-only, matching the previous CI: a new upstream advisory should be
  # visible without blocking an unrelated change. See .cargo/audit.toml.
  audit:
    name: audit
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # Proves the static release targets still compile on every change, so a tag
  # push cannot be the first time we discover a musl break. Both musl rows from
  # release.yml are covered; the darwin rows are exercised by the release run.
  build:
    name: build (${{ matrix.target }})
    needs: [test, clippy, fmt]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install musl toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          {
            echo "CC_x86_64_unknown_linux_musl=musl-gcc"
            echo "CC_aarch64_unknown_linux_musl=musl-gcc"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
          } >> "$GITHUB_ENV"
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} --verbose
      - name: verify binary exists
        run: test -f target/${{ matrix.target }}/release/cc-loadout
