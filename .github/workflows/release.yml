name: Release

on:
  push:
    branches: [master]
  # Lets you re-run asset upload for the current Cargo.toml version without
  # waiting for a new release commit.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

# Never let two release runs race on tags or on the release PR.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # release-plz derives the next version and the CHANGELOG from Conventional
  # Commit subjects. `release` tags + creates the GitHub Release once a version
  # bump has landed on master; `release-pr` then opens/refreshes the PR that
  # carries the next bump. Config lives in release-plz.toml (publish = false —
  # nothing is pushed to crates.io).
  #
  # NOTE: with the default GITHUB_TOKEN, PRs and tags created here do not
  # trigger other workflows. Add a PAT as the RELEASE_PLZ_TOKEN secret to get
  # CI running on the release PR; asset upload below does not depend on it.
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # release-plz needs full history + every v* tag to find the last
          # release and compute the next version; a shallow clone makes it
          # treat the run as an initial release and silently skip the bump.
          fetch-depth: 0
      - name: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      # release-plz only bumps Cargo.toml/Cargo.lock/CHANGELOG.md, but
      # .claude-plugin/plugin.json carries the same version and
      # tests/test_plugin_manifest.sh asserts the two match. Without this the
      # release PR would land a version mismatch and turn master red.
      - name: sync plugin.json onto the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          branch="$(gh pr list --state open --json headRefName,title \
            --jq '[.[] | select(.title | startswith("chore: release"))][0].headRefName')"
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            echo "no open release PR — nothing to sync"; exit 0
          fi
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          current="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' .claude-plugin/plugin.json | head -1)"
          if [ "$version" = "$current" ]; then
            echo "plugin.json already at ${version}"; exit 0
          fi
          sed -i "s/\"version\": \"${current}\"/\"version\": \"${version}\"/" .claude-plugin/plugin.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync plugin.json version to ${version}" .claude-plugin/plugin.json
          git push origin "$branch"
          echo "synced plugin.json ${current} -> ${version} on ${branch}"

  # Decide whether there is a release awaiting binaries. Derived from
  # Cargo.toml + the GitHub API rather than from action outputs, so it stays
  # correct on a manual workflow_dispatch too.
  check:
    name: check for release
    runs-on: ubuntu-latest
    needs: [release-plz]
    outputs:
      tag: ${{ steps.probe.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ -n "$version" ] || { echo "could not read version from Cargo.toml" >&2; exit 1; }
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
            echo "release v${version} exists — will attach binaries"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "no release for v${version} yet — nothing to attach"
          fi

  # Target list, runner choice and asset layout are kept identical to
  # XBlueSky/cc-uplink, so a plugin launcher that pins one repo's binaries can
  # resolve the other's with the same uname -> target mapping.
  assets:
    name: ${{ matrix.target }}
    needs: [check]
    if: needs.check.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl => fully static: runs on any Linux with kernel >= 3.2,
          # including old-glibc hosts that gnu builds from ubuntu-22.04+
          # runners (glibc >= 2.35) cannot reach.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # macos-13 (last Intel runner) is retired — cross-compile the
          # x86_64 slice on Apple Silicon instead (SDKs are multi-arch).
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          {
            echo "CC_x86_64_unknown_linux_musl=musl-gcc"
            echo "CC_aarch64_unknown_linux_musl=musl-gcc"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
          } >> "$GITHUB_ENV"
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} --verbose
      # Archive layout and checksum naming match
      # taiki-e/upload-rust-binary-action (what cc-uplink publishes with): the
      # bare binary at the archive root, and a `<bin>-<target>.sha256` whose
      # body names the .tar.gz so `sha256sum -c` works from the download dir.
      - name: package asset
        run: |
          bin="target/${{ matrix.target }}/release/cc-loadout"
          test -f "$bin" || { echo "missing binary: $bin" >&2; exit 1; }
          asset="cc-loadout-${{ matrix.target }}.tar.gz"
          sum="cc-loadout-${{ matrix.target }}.sha256"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" cc-loadout
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$sum"
          else
            shasum -a 256 "$asset" > "$sum"
          fi
          cat "$sum"
      - name: upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.check.outputs.tag }}" \
            "cc-loadout-${{ matrix.target }}.tar.gz" \
            "cc-loadout-${{ matrix.target }}.sha256" --clobber
